<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장지성 | 프로젝트 기록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=11">
  <script src="assets/js/main.js?v=11"></script>
  <script src="assets/js/projects.js?v=11" defer></script>
</head>
<body>
<main class="container">

  <section class="page-head">
    <p class="eyebrow">Projects</p>
    <h1>프로젝트 기록</h1>
    <p>진행했던 프로젝트와 그 과정에서 느낀 점, 탐색한 아이디어를 기록합니다.</p>
  </section>

  <section class="block">
    <div class="ai-panel">
      <div class="ai-head">
        <div>
          <p class="ai-eyebrow">AI × Architecture</p>
          <h2>AI 활용 기록</h2>
          <p>AI 도구를 실제 작업에 적용해 본 경험과 그 결과물을 모았습니다.</p>
        </div>
        <div class="ai-stat"><b id="ai-count">–</b><span>기록</span></div>
      </div>
      <div class="ai-toolbar">
        <span>사용한 도구</span>
        <div class="ai-tools" id="ai-tools"></div>
      </div>
      <div class="ai-grid" id="ai-list">
        <p class="empty">불러오는 중…</p>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="block-title"><h2>프로젝트</h2><small>설계 · 연구 · 공모전</small></div>
    <div class="project-list" id="project-list">
      <p class="empty">불러오는 중…</p>
    </div>
  </section>

</main>
</body>
</html>
